<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1712">
<meta name="description" content="퍼팅 라이 읽기 연습 시뮬레이터. 경사와 곡면 위에서 공이 어떻게 굴러가는지 물리로 계산합니다.">
<meta property="og:title" content="Green Reader — 퍼팅 라이 시뮬레이터">
<meta property="og:description" content="조준과 세기를 정하고 공을 굴려보세요. 그린 코드로 친구와 같은 그린에서 겨룰 수 있습니다.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230B1712'/><circle cx='16' cy='19' r='4' fill='%23EDF2E6'/><path d='M16 15V6l7 3-7 3' fill='%23D7263D'/></svg>">
<title>Green Reader — 퍼팅 라이 시뮬레이터</title>
<style>
  :root{
    --ink:#0B1712; --panel:#12211A; --line:#263D31;
    --chalk:#EDF2E6; --dim:#7E9285; --flag:#D7263D; --mark:#F2C14E; --ideal:#63D2C3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
  .seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{padding:6px 14px;background:transparent;border:none;color:var(--dim);
    font-size:11px;font-weight:600;letter-spacing:.08em;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--chalk);color:var(--ink)}
  #stageBar{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
  #stageBar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--dim);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
  .chip.gen{color:var(--mark);border-color:#54542F}
  .chip.gen.solid{background:var(--mark);color:#231B00;border-color:var(--mark);font-weight:700}
  .chip .st{color:var(--mark);font-weight:700}
  .chip[aria-pressed="true"] .st{color:#8A6D14}
  .sep{flex:0 0 auto;width:1px;background:var(--line);margin:2px 4px}
  #stage{flex:1 1 auto;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%}
  #lie{position:absolute;top:10px;left:12px;font:500 11px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--dim);letter-spacing:.05em;pointer-events:none}
  #lie b{color:var(--chalk);font-weight:600}
  #lie .code{color:var(--mark)}
  #hud{position:absolute;top:10px;right:12px;text-align:right;
    font:500 11px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}
  #hud b{color:var(--chalk);font-weight:600}
  .hbtn{display:block;margin:6px 0 0 auto;padding:6px 10px;border-radius:8px;border:1px solid var(--line);
    background:rgba(11,23,18,.65);color:var(--dim);font-size:11px;cursor:pointer}
  .hbtn[aria-pressed="true"]{color:var(--chalk);border-color:var(--chalk)}
  #result{position:absolute;left:0;right:0;bottom:10px;text-align:center;
    font:500 13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;
    pointer-events:none;opacity:0;transition:opacity .18s;padding:0 12px}
  #result.show{opacity:1}
  #result .pts{color:var(--mark);font-weight:700;font-size:15px}
  #result .cmp{color:var(--dim);font-size:11px}
  #result .cmp i{color:var(--ideal);font-style:normal}
  #toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(11,23,18,.92);border:1px solid var(--line);border-radius:10px;
    padding:12px 18px;font:500 12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
  #toast.show{opacity:1}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px 16px}
  .row{margin-bottom:12px}
  .row-head{display:flex;align-items:baseline;margin-bottom:6px}
  .row-head span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .row-head output{margin-left:auto;font:600 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;display:block}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
  input[type=range]::-moz-range-track{height:2px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-12px;border-radius:50%;background:var(--chalk);border:none}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--chalk);border:none}
  input[type=range]:focus-visible{outline:2px solid var(--mark);outline-offset:4px}
  .acts{display:flex;gap:8px}
  button.act{flex:1;padding:14px 8px;border-radius:10px;border:1px solid var(--line);background:transparent;
    color:var(--chalk);font-size:13px;font-weight:600;cursor:pointer}
  button.act.primary{background:var(--chalk);color:var(--ink);border-color:var(--chalk);flex:2}
  button.act.ideal[aria-pressed="true"]{border-color:var(--ideal);color:var(--ideal)}
  button.act:disabled{opacity:.3}
</style>
</head>
<body>

<header>
  <h1>Green Reader</h1>
  <div class="seg" role="group" aria-label="모드">
    <button id="mPractice" aria-pressed="true">연습</button>
    <button id="mChallenge" aria-pressed="false">도전</button>
  </div>
</header>

<div id="stageBar" role="group" aria-label="스테이지 선택"></div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="lie"></div>
  <div id="hud"></div>
  <div id="result"></div>
  <div id="toast"></div>
</div>

<footer>
  <div class="row">
    <div class="row-head"><span>조준</span><output id="aimOut">0.0°</output></div>
    <input id="aim" type="range" min="-20" max="20" step="0.5" value="0" aria-label="조준 방향">
  </div>
  <div class="row">
    <div class="row-head"><span>세기 · 평지 5m 기준</span><output id="powOut">100%</output></div>
    <input id="pow" type="range" min="50" max="220" step="5" value="100" aria-label="스트로크 세기">
  </div>
  <div class="acts">
    <button class="act primary" id="putt">퍼팅</button>
    <button class="act ideal" id="idealBtn" aria-pressed="false">정답 라인</button>
    <button class="act" id="reset">다시</button>
  </div>
</footer>

<script>
"use strict";

/* ── 물리 ──────────────────────────────────── */
const G=9.81, STIMP_FT=10.0, V_STIMP=1.83;
const DECEL=(V_STIMP*V_STIMP)/(2*STIMP_FT*0.3048);
const HOLE_R=0.054, CAPTURE_V=1.4, DT=1/240, SDT=1/120, MAX_T=25;
const V_BASE=Math.sqrt(2*DECEL*5.0);
const V_TARGET=Math.sqrt(2*DECEL*0.43);
const EXAG=3.0;

/* ── 지형 ──────────────────────────────────── */
const FIXED=[
  {name:"평지 5m", dist:5, ax:0, ay:0, f:[]},
  {name:"오르막 6m", dist:6, ax:0, ay:0.035, f:[]},
  {name:"내리막 4m", dist:4, ax:0, ay:-0.030, f:[]},
  {name:"우측 높은 5m", dist:5, ax:0.030, ay:0, f:[]},
  {name:"능선 넘기 6m", dist:6, ax:0, ay:0, f:[{t:"g",amp:0.10,cx:0,cy:3.0,sx:8,sy:0.9}]},
  {name:"접시 5m", dist:5, ax:0, ay:0.010, f:[{t:"g",amp:-0.11,cx:1.1,cy:2.6,sx:1.7,sy:2.1}]},
  {name:"둔덕 피하기 5m", dist:5, ax:0, ay:0, f:[{t:"g",amp:0.13,cx:-0.9,cy:2.4,sx:1.1,sy:1.4}]},
  {name:"이중 브레이크 6m", dist:6, ax:0, ay:0.008,
   f:[{t:"g",amp:0.10,cx:-1.3,cy:1.8,sx:1.3,sy:1.5},{t:"g",amp:-0.10,cx:1.3,cy:4.2,sx:1.3,sy:1.5}]},
  {name:"새들 6m", dist:6, ax:0, ay:0, f:[{t:"s",k:0.016,cx:0,cy:3.0}]},
];
const RIDX=FIXED.length;
const STAGES=FIXED.concat([{name:"랜덤 그린", dist:5, ax:0, ay:0, f:[], code:null}]);
let SI=0, S=STAGES[0];

function height(x,y){
  let h=S.ax*x+S.ay*y;
  for(const o of S.f){
    if(o.t==="g"){
      const dx=(x-o.cx)/o.sx, dy=(y-o.cy)/o.sy;
      h+=o.amp*Math.exp(-(dx*dx+dy*dy)/2);
    }else{const dx=x-o.cx,dy=y-o.cy;h+=o.k*(dx*dx-dy*dy);}
  }
  return h;
}
const EPS=0.004;
function grad(x,y){
  return {gx:(height(x+EPS,y)-height(x-EPS,y))/(2*EPS),
          gy:(height(x,y+EPS)-height(x,y-EPS))/(2*EPS)};
}

/* ── 적분기 ────────────────────────────────── */
function advance(st,dt){
  const sp=Math.hypot(st.vx,st.vy), g=grad(st.x,st.y);
  let ax=-G*g.gx, ay=-G*g.gy;
  if(sp>1e-4){ax-=DECEL*st.vx/sp; ay-=DECEL*st.vy/sp;}
  st.vx+=ax*dt; st.vy+=ay*dt; st.x+=st.vx*dt; st.y+=st.vy*dt; st.t+=dt; st.g=g;
  return Math.hypot(st.vx,st.vy);
}
function statusOf(st,sp){
  if(Math.hypot(st.x,st.y-S.dist)<HOLE_R && sp<CAPTURE_V) return "hole";
  if(sp<0.02 && G*Math.hypot(st.g.gx,st.g.gy)<=DECEL) return "stop";
  if(st.y<view.y0||st.y>view.y1||Math.abs(st.x)>3.2||st.t>MAX_T) return "out";
  return "roll";
}
function simulate(aimDeg,powPct,record){
  const a=aimDeg*Math.PI/180, v0=V_BASE*powPct/100;
  const st={x:0,y:0,vx:-Math.sin(a)*v0,vy:Math.cos(a)*v0,t:0,g:grad(0,0)};
  const path=record?[[0,0]]:null;
  let minD=Infinity,vAtMin=0,res="roll";
  for(let i=0;i<MAX_T/SDT;i++){
    const sp=advance(st,SDT), d=Math.hypot(st.x,st.y-S.dist);
    if(d<minD){minD=d;vAtMin=sp;}
    if(record){const p=path[path.length-1];
      if(Math.hypot(st.x-p[0],st.y-p[1])>0.02)path.push([st.x,st.y]);}
    res=statusOf(st,sp); if(res!=="roll")break;
  }
  return {holed:res==="hole",res,minD,vAtMin,x:st.x,y:st.y,path};
}

/* ── 솔버 ──────────────────────────────────── */
function solve(){
  const cost=r=>r.holed ? -1000+Math.abs(r.vAtMin-V_TARGET)*10
                        : r.minD*100+Math.abs(r.vAtMin-V_TARGET);
  let best=null,bestC=Infinity;
  const scan=(a0,a1,da,p0,p1,dp)=>{
    for(let a=a0;a<=a1+1e-9;a+=da)for(let p=p0;p<=p1+1e-9;p+=dp){
      const r=simulate(a,p,false),c=cost(r);
      if(c<bestC){bestC=c;best={aim:a,pow:p};}
    }};
  scan(-20,20,2,55,220,10);
  scan(Math.max(-20,best.aim-2.5),Math.min(20,best.aim+2.5),0.25,
       Math.max(50,best.pow-12),Math.min(220,best.pow+12),1.5);
  const fin=simulate(best.aim,best.pow,true);
  return {aim:best.aim,pow:best.pow,path:fin.path,holed:fin.holed,minD:fin.minD};
}
const solutions={};
function getSolution(cb){
  if(solutions[SI])return cb(solutions[SI]);
  idealBtn.textContent="계산 중";
  setTimeout(()=>{solutions[SI]=solve();idealBtn.textContent="정답 라인";cb(solutions[SI]);},20);
}

/* ── 랜덤 그린 ─────────────────────────────── */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;};}
const toCode=n=>n.toString(36).toUpperCase().padStart(6,"0").slice(-6);
const fromCode=s=>parseInt(String(s).trim().toUpperCase(),36)>>>0;

function buildGreen(seed){
  const r=mulberry32(seed);
  const dist=3.5+Math.round(r()*7)/2;
  const code=toCode(seed);
  const g={name:"랜덤 "+code,dist,ax:(r()*2-1)*0.028,ay:(r()*2-1)*0.030,f:[],code,seed};
  const n=1+Math.floor(r()*3);
  for(let i=0;i<n;i++){
    if(r()<0.22){
      g.f.push({t:"g",amp:(r()<0.5?-1:1)*(0.06+r()*0.06),cx:0,cy:0.8+r()*dist,sx:8,sy:0.7+r()*0.6});
    }else{
      g.f.push({t:"g",amp:(r()<0.5?-1:1)*(0.06+r()*0.08),cx:(r()*2-1)*1.8,
                cy:0.7+r()*(dist*0.95),sx:0.9+r()*1.3,sy:1.0+r()*1.4});
    }
  }
  return g;
}
function maxSlopeOf(g){
  const keep=S;S=g;let m=0;
  for(let y=-0.5;y<g.dist+1;y+=0.4)for(let x=-2.2;x<=2.2;x+=0.4){
    const {gx,gy}=grad(x,y);m=Math.max(m,Math.hypot(gx,gy));
  }
  S=keep;return m;
}
function generateGreen(seed){
  for(let k=0;k<10;k++){
    const s=(seed+k)>>>0, g=buildGreen(s);
    if(maxSlopeOf(g)>0.115) continue;
    const keep=S;S=g;const sol=solve();S=keep;
    if(sol.holed) return {green:g,sol};
  }
  return {green:buildGreen(seed),sol:null};
}
function loadRandom(seed){
  lieEl.innerHTML='<span style="opacity:.6">그린 생성 중…</span>';
  setTimeout(()=>{
    const {green,sol}=generateGreen(seed);
    STAGES[RIDX]=green; SI=RIDX; S=green;
    if(sol) solutions[RIDX]=sol; else delete solutions[RIDX];
    idealPath=null; showIdeal=false; idealBtn.setAttribute("aria-pressed",false);
    stageState[RIDX]={tries:0,best:0};
    chips[RIDX].style.display="";
    select(RIDX);
    try{history.replaceState(null,"","?g="+green.code);}catch(e){}
  },20);
}
function shareLink(){
  if(!STAGES[RIDX].code){toast("먼저 새 그린을 만들어 주세요");return;}
  const url=location.origin+location.pathname+"?g="+STAGES[RIDX].code;
  const done=()=>toast("링크를 복사했습니다\n"+STAGES[RIDX].code);
  if(navigator.clipboard&&location.protocol!=="file:"){
    navigator.clipboard.writeText(url).then(done,()=>prompt("아래 링크를 복사하세요",url));
  }else prompt("아래 링크를 복사하세요",url);
}
let toastT=null;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.className="show";
  clearTimeout(toastT);toastT=setTimeout(()=>el.className="",1800);
}

/* ── 카메라 / 투영 ─────────────────────────── */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=0,H=0,scale=1,ox=0,oy=0,view={x0:-3.2,x1:3.2,y0:-1.3,y1:7};
let terrain=null,showArrows=true,viewMode="eye",cam=null;

function computeView(){
  view={x0:-3.2,x1:3.2,y0:-1.3,y1:S.dist+1.9};
  const vw=view.x1-view.x0,vh=view.y1-view.y0;
  scale=Math.min(W/vw,H/vh);
  ox=(W-vw*scale)/2-view.x0*scale; oy=H-(H-vh*scale)/2+view.y0*scale;
  computeCam();
}
function computeCam(){
  const eye={x:0,y:-2.6,z:height(0,0)*EXAG+1.90};
  const tgt={x:0,y:S.dist*0.62,z:height(0,S.dist*0.62)*EXAG+0.15};
  let fx=tgt.x-eye.x,fy=tgt.y-eye.y,fz=tgt.z-eye.z;
  const fl=Math.hypot(fx,fy,fz);fx/=fl;fy/=fl;fz/=fl;
  let rx=fy,ry=-fx,rz=0;
  const rl=Math.hypot(rx,ry,rz)||1;rx/=rl;ry/=rl;rz/=rl;
  const ux=ry*fz-rz*fy, uy=rz*fx-rx*fz, uz=rx*fy-ry*fx;
  cam={eye,fwd:[fx,fy,fz],right:[rx,ry,rz],up:[ux,uy,uz],f:(H/2)/Math.tan(25*Math.PI/180)};
}
function project(x,y,dz){
  if(viewMode==="top") return {X:ox+x*scale, Y:oy-y*scale, ok:true};
  const z=height(x,y)*EXAG+(dz||0);
  const d=[x-cam.eye.x, y-cam.eye.y, z-cam.eye.z];
  const cz=d[0]*cam.fwd[0]+d[1]*cam.fwd[1]+d[2]*cam.fwd[2];
  if(cz<0.25) return {X:0,Y:0,ok:false,cz};
  const cx=d[0]*cam.right[0]+d[1]*cam.right[1]+d[2]*cam.right[2];
  const cy=d[0]*cam.up[0]+d[1]*cam.up[1]+d[2]*cam.up[2];
  return {X:W/2+cam.f*cx/cz, Y:H/2-cam.f*cy/cz, ok:true, cz};
}
function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  computeView();buildTerrain();draw();
}

/* ── 지형 렌더 ─────────────────────────────── */
function buildTerrain(){
  terrain=document.createElement("canvas");
  const dpr=Math.min(window.devicePixelRatio||1,2);
  terrain.width=W*dpr;terrain.height=H*dpr;
  const t=terrain.getContext("2d");t.setTransform(dpr,0,0,dpr,0,0);

  const N=viewMode==="top"?64:52, hs=[],xs=[],ys=[];
  let hmin=Infinity,hmax=-Infinity;
  for(let i=0;i<=N;i++)xs[i]=view.x0+(view.x1-view.x0)*i/N;
  for(let j=0;j<=N;j++)ys[j]=view.y0+(view.y1-view.y0)*j/N;
  for(let j=0;j<=N;j++){hs[j]=[];
    for(let i=0;i<=N;i++){const h=height(xs[i],ys[j]);hs[j][i]=h;
      if(h<hmin)hmin=h;if(h>hmax)hmax=h;}}
  const span=Math.max(hmax-hmin,1e-6);
  const shade=(x,y)=>{
    const {gx,gy}=grad(x,y);
    const nx=-gx*EXAG,ny=-gy*EXAG,nl=Math.hypot(nx,ny,1);
    return 0.72+0.34*Math.max(0,(nx*-0.35+ny*-0.55+0.76)/nl);
  };
  const col=(u,k)=>`rgb(${Math.round((31+u*79)*k)},${Math.round((61+u*94)*k)},${Math.round((43+u*44)*k)})`;

  if(viewMode==="top"){
    const cw=(view.x1-view.x0)/N*scale+1, ch=(view.y1-view.y0)/N*scale+1;
    for(let j=0;j<N;j++)for(let i=0;i<N;i++){
      t.fillStyle=col((hs[j][i]-hmin)/span,1);
      t.fillRect(project(xs[i],ys[j],0).X-.5, project(xs[i],ys[j+1],0).Y-.5, cw, ch);
    }
  }else{
    for(let j=N-1;j>=0;j--)for(let i=0;i<N;i++){
      const p0=project(xs[i],ys[j]),p1=project(xs[i+1],ys[j]),
            p2=project(xs[i+1],ys[j+1]),p3=project(xs[i],ys[j+1]);
      if(!p0.ok||!p1.ok||!p2.ok||!p3.ok)continue;
      const c=col((hs[j][i]-hmin)/span, shade((xs[i]+xs[i+1])/2,(ys[j]+ys[j+1])/2));
      t.fillStyle=c;t.strokeStyle=c;t.lineWidth=.6;
      t.beginPath();t.moveTo(p0.X,p0.Y);t.lineTo(p1.X,p1.Y);
      t.lineTo(p2.X,p2.Y);t.lineTo(p3.X,p3.Y);t.closePath();t.fill();t.stroke();
    }
  }

  const STEP=0.05;
  t.strokeStyle="rgba(237,242,230,.26)";t.lineWidth=1;t.beginPath();
  for(let lv=Math.ceil(hmin/STEP)*STEP;lv<=hmax;lv+=STEP){
    for(let j=0;j<N;j++)for(let i=0;i<N;i++){
      const a=hs[j][i],b=hs[j][i+1],c=hs[j+1][i+1],d=hs[j+1][i],pts=[];
      const cr=(h1,h2,ax,ay,bx,by)=>{
        if((h1<lv)!==(h2<lv)){const f=(lv-h1)/(h2-h1);pts.push([ax+(bx-ax)*f,ay+(by-ay)*f]);}};
      cr(a,b,xs[i],ys[j],xs[i+1],ys[j]);    cr(b,c,xs[i+1],ys[j],xs[i+1],ys[j+1]);
      cr(c,d,xs[i+1],ys[j+1],xs[i],ys[j+1]);cr(d,a,xs[i],ys[j+1],xs[i],ys[j]);
      if(pts.length===2){
        const A=project(pts[0][0],pts[0][1],0.004),B=project(pts[1][0],pts[1][1],0.004);
        if(A.ok&&B.ok){t.moveTo(A.X,A.Y);t.lineTo(B.X,B.Y);}
      }
    }}
  t.stroke();
  if(showArrows&&mode==="practice")drawArrows(t);
}
function drawArrows(t){
  const gap=0.85;t.lineWidth=1.4;t.lineCap="round";
  for(let y=view.y0+gap;y<view.y1;y+=gap)for(let x=view.x0+gap/2;x<view.x1;x+=gap){
    const {gx,gy}=grad(x,y),s=Math.hypot(gx,gy);
    if(s<0.004)continue;
    const dx=-gx/s,dy=-gy/s,L=Math.min(0.34,0.06+s*3.2);
    const A=project(x-dx*L/2,y-dy*L/2,0.005), B=project(x+dx*L/2,y+dy*L/2,0.005);
    if(!A.ok||!B.ok)continue;
    t.strokeStyle=`rgba(237,242,230,${Math.min(.72,.20+s*7)})`;
    t.beginPath();t.moveTo(A.X,A.Y);t.lineTo(B.X,B.Y);
    const ang=Math.atan2(B.Y-A.Y,B.X-A.X),hd=Math.hypot(B.X-A.X,B.Y-A.Y)*0.34;
    t.moveTo(B.X,B.Y);t.lineTo(B.X-hd*Math.cos(ang-0.42),B.Y-hd*Math.sin(ang-0.42));
    t.moveTo(B.X,B.Y);t.lineTo(B.X-hd*Math.cos(ang+0.42),B.Y-hd*Math.sin(ang+0.42));
    t.stroke();
  }
}

/* ── 상태 ──────────────────────────────────── */
let ball={x:0,y:0},vel={x:0,y:0},rolling=false,trail=[],holed=false,simT=0,lastG=grad(0,0);
let mode="practice",showIdeal=false,idealPath=null;
const stageState=STAGES.map(()=>({tries:0,best:0}));
const TRIES=3;

const aimEl=document.getElementById("aim"),powEl=document.getElementById("pow");
const aimOut=document.getElementById("aimOut"),powOut=document.getElementById("powOut");
const resEl=document.getElementById("result"),lieEl=document.getElementById("lie");
const puttBtn=document.getElementById("putt"),idealBtn=document.getElementById("idealBtn");
const hud=document.getElementById("hud");

const viewBtn=document.createElement("button");
viewBtn.className="hbtn";viewBtn.textContent="위에서 보기";viewBtn.setAttribute("aria-pressed",true);
const togBtn=document.createElement("button");
togBtn.className="hbtn";togBtn.textContent="경사 화살표";togBtn.setAttribute("aria-pressed",true);

function resetBall(){
  ball={x:0,y:0};vel={x:0,y:0};trail=[];rolling=false;holed=false;simT=0;lastG=grad(0,0);
  resEl.className="";resEl.innerHTML="";
  puttBtn.disabled=mode==="challenge"&&stageState[SI].tries>=TRIES;
  draw();
}
const fmtAim=v=>(v>0?"L ":v<0?"R ":"")+Math.abs(v).toFixed(1)+"°";

function showLie(){
  let up=0,side=0,maxS=0;
  for(let k=0;k<=10;k++){
    const y=S.dist*k/10,{gx,gy}=grad(0,y);
    up+=gy;side+=gx;maxS=Math.max(maxS,Math.hypot(gx,gy));
  }
  up=up/11*100;side=side/11*100;
  const code=S.code?`<br>코드 <span class="code">${S.code}</span>`:"";
  if(mode==="challenge"){
    lieEl.innerHTML=`거리 <b>${S.dist.toFixed(1)}m</b><br><span style="opacity:.5">라이 정보 비공개</span>${code}`;return;
  }
  const upTxt=Math.abs(up)<0.3?"전체 평지":(up>0?`전체 오르막 ${up.toFixed(1)}%`:`전체 내리막 ${Math.abs(up).toFixed(1)}%`);
  const sideTxt=Math.abs(side)<0.3?"직선 라이":(side>0?`왼쪽으로 휨 ${side.toFixed(1)}%`:`오른쪽으로 휨 ${Math.abs(side).toFixed(1)}%`);
  lieEl.innerHTML=`거리 <b>${S.dist.toFixed(1)}m</b><br>${upTxt}<br>${sideTxt}<br>최대 경사 <b>${(maxS*100).toFixed(1)}%</b>${code}`;
}
function updateHUD(){
  hud.innerHTML="";
  if(mode==="challenge"){
    const st=stageState[SI],total=stageState.reduce((s,o)=>s+o.best,0);
    const d=document.createElement("div");
    d.innerHTML=`시도 <b>${st.tries}/${TRIES}</b><br>이 홀 <b>${st.best}</b>점<br>합계 <b>${total}</b>점`;
    hud.appendChild(d);
  }
  hud.appendChild(viewBtn);
  if(mode==="practice")hud.appendChild(togBtn);
  chips.forEach((c,i)=>{
    const s=stageState[i];
    c.innerHTML=STAGES[i].name+(mode==="challenge"&&s.best>0?` <span class="st">${s.best}</span>`:"");
  });
}

/* ── 라이브 ────────────────────────────────── */
function loopStep(){
  const st={x:ball.x,y:ball.y,vx:vel.x,vy:vel.y,t:simT,g:lastG};
  const sp=advance(st,DT);
  ball={x:st.x,y:st.y};vel={x:st.vx,y:st.vy};simT=st.t;lastG=st.g;
  const res=statusOf(st,sp);
  if(res!=="roll"){rolling=false;if(res==="hole"){holed=true;ball={x:0,y:S.dist};}finish(res);}
}
const score=(res,d)=>res==="hole"?100:res==="out"?0:Math.max(0,Math.round(100-d*55));

function finish(res){
  const d=Math.hypot(ball.x,ball.y-S.dist), pts=score(res,d), st=stageState[SI];
  st.tries++;st.best=Math.max(st.best,pts);
  const sol=solutions[SI];
  const cmp=sol?`<span class="cmp">내 퍼팅 ${fmtAim(+aimEl.value)} · ${powEl.value}%　|　`
    +`정답 <i>${fmtAim(sol.aim)} · ${Math.round(sol.pow)}%</i></span>`:"";
  const head=res==="hole"?"홀인":res==="out"?"그린 이탈"
    :`${d.toFixed(2)}m 남음 · ${ball.y>S.dist?"지나침":"짧음"}`
      +(Math.abs(ball.x)>0.05?` · ${ball.x>0?"오른":"왼"}쪽`:"");
  resEl.innerHTML=`<span class="pts">${pts}점</span>　${head}${cmp?"<br>"+cmp:""}`;
  resEl.className="show";
  if(mode==="challenge"&&st.tries>=TRIES){showIdeal=true;idealBtn.setAttribute("aria-pressed",true);loadIdeal();}
  puttBtn.disabled=mode==="challenge"&&st.tries>=TRIES;
  updateHUD();
}
let last=0;
function loop(t){
  if(rolling){
    const n=Math.min(8,Math.round(((t-last)||16)/1000/DT));
    for(let i=0;i<n&&rolling;i++)loopStep();
    const p=trail[trail.length-1];
    if(!p||Math.hypot(ball.x-p[0],ball.y-p[1])>0.02)trail.push([ball.x,ball.y]);
    draw();
  }
  last=t;requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── 그리기 ────────────────────────────────── */
function polyline(pts,dz){
  let started=false;ctx.beginPath();
  for(const p of pts){
    const q=project(p[0],p[1],dz);
    if(!q.ok){started=false;continue;}
    if(!started){ctx.moveTo(q.X,q.Y);started=true;}else ctx.lineTo(q.X,q.Y);
  }
  ctx.stroke();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(terrain)ctx.drawImage(terrain,0,0,W,H);

  ctx.strokeStyle="rgba(237,242,230,.07)";ctx.lineWidth=1;
  for(let m=1;m<=Math.floor(view.y1);m++){
    const pts=[];for(let x=-3.2;x<=3.2;x+=0.4)pts.push([x,m]);
    polyline(pts,0.004);
  }
  if(showIdeal&&idealPath&&idealPath.length>1){
    ctx.save();ctx.setLineDash([5,5]);
    ctx.strokeStyle="rgba(99,210,195,.95)";ctx.lineWidth=2;ctx.lineJoin="round";
    polyline(idealPath,0.012);ctx.restore();
  }
  if(!rolling&&!holed){
    const a=(+aimEl.value)*Math.PI/180,L=S.dist*1.1,pts=[];
    for(let s=0;s<=L;s+=0.15)pts.push([-Math.sin(a)*s,Math.cos(a)*s]);
    ctx.save();ctx.setLineDash([6,7]);
    ctx.strokeStyle="rgba(237,242,230,.8)";ctx.lineWidth=1.5;
    polyline(pts,0.010);ctx.restore();
  }
  const hc=[];for(let k=0;k<24;k++){
    const a=k/24*Math.PI*2;hc.push([Math.sin(a)*HOLE_R,S.dist+Math.cos(a)*HOLE_R]);}
  let ok=true;ctx.fillStyle="#0A120D";ctx.beginPath();
  hc.forEach((p,i)=>{const q=project(p[0],p[1],0.002);if(!q.ok){ok=false;return;}
    i?ctx.lineTo(q.X,q.Y):ctx.moveTo(q.X,q.Y);});
  if(ok){ctx.closePath();ctx.fill();ctx.strokeStyle="rgba(237,242,230,.5)";ctx.lineWidth=1;ctx.stroke();}
  const base=project(0,S.dist,0), top=project(0,S.dist,viewMode==="top"?0:1.35);
  if(base.ok&&top.ok){
    const tipX=viewMode==="top"?base.X:top.X, tipY=viewMode==="top"?base.Y-54:top.Y;
    ctx.strokeStyle="rgba(237,242,230,.55)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(base.X,base.Y);ctx.lineTo(tipX,tipY);ctx.stroke();
    const fw=viewMode==="top"?26:Math.max(10,Math.min(30,700/(top.cz||8)));
    ctx.fillStyle="#D7263D";ctx.beginPath();
    ctx.moveTo(tipX,tipY);ctx.lineTo(tipX+fw,tipY+fw*0.32);ctx.lineTo(tipX,tipY+fw*0.62);ctx.fill();
  }
  if(trail.length>1){
    ctx.strokeStyle="rgba(242,193,78,.9)";ctx.lineWidth=2;ctx.lineJoin="round";
    polyline(trail,0.014);
  }
  if(!holed){
    const q=project(ball.x,ball.y,0.021);
    if(q.ok){
      const r=viewMode==="top"?6:Math.max(2.5,Math.min(14,0.055*cam.f/q.cz));
      ctx.fillStyle="#EDF2E6";ctx.beginPath();ctx.arc(q.X,q.Y,r,0,7);ctx.fill();
    }
  }
}

/* ── 입력 ──────────────────────────────────── */
aimEl.addEventListener("input",()=>{aimOut.textContent=fmtAim(+aimEl.value);draw();});
powEl.addEventListener("input",()=>{powOut.textContent=powEl.value+"%";});
puttBtn.addEventListener("click",()=>{
  if(rolling)return;
  if(mode==="challenge"&&stageState[SI].tries>=TRIES)return;
  resetBall();
  const a=(+aimEl.value)*Math.PI/180,v0=V_BASE*(+powEl.value)/100;
  vel={x:-Math.sin(a)*v0,y:Math.cos(a)*v0};
  trail=[[0,0]];rolling=true;puttBtn.disabled=true;
});
document.getElementById("reset").addEventListener("click",resetBall);
function loadIdeal(){getSolution(sol=>{idealPath=sol.path;draw();});}
idealBtn.addEventListener("click",()=>{
  if(mode==="challenge"&&stageState[SI].tries<TRIES){
    resEl.innerHTML='<span class="cmp">3번 시도 후에 공개됩니다</span>';resEl.className="show";return;}
  showIdeal=!showIdeal;idealBtn.setAttribute("aria-pressed",showIdeal);
  if(showIdeal)loadIdeal();else draw();
});
togBtn.addEventListener("click",()=>{
  showArrows=!showArrows;togBtn.setAttribute("aria-pressed",showArrows);buildTerrain();draw();
});
viewBtn.addEventListener("click",()=>{
  viewMode=viewMode==="top"?"eye":"top";
  viewBtn.setAttribute("aria-pressed",viewMode==="eye");
  viewBtn.textContent=viewMode==="eye"?"위에서 보기":"3D 시점";
  computeView();buildTerrain();draw();
});
function setMode(m){
  mode=m;
  document.getElementById("mPractice").setAttribute("aria-pressed",m==="practice");
  document.getElementById("mChallenge").setAttribute("aria-pressed",m==="challenge");
  if(m==="challenge"){showIdeal=false;idealBtn.setAttribute("aria-pressed",false);}
  stageState.forEach(s=>{s.tries=0;s.best=0;});
  buildTerrain();showLie();updateHUD();resetBall();
}
document.getElementById("mPractice").addEventListener("click",()=>setMode("practice"));
document.getElementById("mChallenge").addEventListener("click",()=>setMode("challenge"));

/* ── 스테이지 바: 새 그린 · 코드 · 링크 → 랜덤 → 고정 ── */
const bar=document.getElementById("stageBar");
function mkAction(label,solid,fn){
  const b=document.createElement("button");
  b.className="chip gen"+(solid?" solid":"");b.textContent=label;
  b.addEventListener("click",fn);bar.appendChild(b);return b;
}
mkAction("＋ 새 그린",true,()=>loadRandom((Math.random()*1e9)>>>0));
mkAction("코드 입력",false,()=>{
  const v=prompt("그린 코드를 입력하세요 (예: 3F9K2A)");
  if(!v)return;
  const s=fromCode(v);
  if(!isFinite(s)||isNaN(s)){toast("코드를 읽을 수 없습니다");return;}
  loadRandom(s);
});
mkAction("링크 복사",false,shareLink);
const sep=document.createElement("div");sep.className="sep";bar.appendChild(sep);

const chips=[];
function select(i){
  SI=i;S=STAGES[i];idealPath=null;
  if(mode==="challenge")showIdeal=false;
  idealBtn.setAttribute("aria-pressed",showIdeal);
  chips.forEach((c,j)=>c.setAttribute("aria-pressed",j===i));
  computeView();buildTerrain();showLie();updateHUD();resetBall();
  if(showIdeal)loadIdeal();
}
STAGES.forEach((st,i)=>{
  const b=document.createElement("button");
  b.className="chip";b.textContent=st.name;b.setAttribute("aria-pressed",i===0);
  b.addEventListener("click",()=>select(i));
  chips[i]=b;
});
chips[RIDX].style.display="none";
bar.appendChild(chips[RIDX]);
for(let i=0;i<RIDX;i++)bar.appendChild(chips[i]);

window.addEventListener("resize",resize);
showLie();updateHUD();resize();

/* 링크에 코드가 있으면 그 그린으로, 없으면 새 랜덤 그린으로 시작 */
const q=new URLSearchParams(location.search).get("g");
const qs=q?fromCode(q):NaN;
loadRandom(isFinite(qs)&&!isNaN(qs)?qs:(Math.random()*1e9)>>>0);
</script>
